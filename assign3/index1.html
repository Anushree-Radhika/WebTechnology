<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CST Department Faculty - IIEST</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #ecf0f1;
            --accent-color: #3498db;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--secondary-color);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .search-container {
            margin-bottom: 20px;
            text-align: center;
        }
        input[type="text"] {
            padding: 10px; width: 300px;
            border: 1px solid #ccc; border-radius: 4px;
        }
        button {
            padding: 10px 20px; background-color: var(--accent-color);
            color: white; border: none; border-radius: 4px; cursor: pointer;
        }
        button:hover { background-color: #2980b9; }
        
        .profile-card {
            background: white; border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 400px; padding: 20px; text-align: center;
            display: none; /* Hidden until search */
        }
        .profile-pic {
            width: 150px; height: 150px; border-radius: 50%;
            object-fit: cover; border: 3px solid var(--primary-color);
        }
        .error { color: red; font-weight: bold; }
        .details { text-align: left; margin-top: 15px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="search-container">
        <h2>Faculty Directory</h2>
        <input type="text" id="searchInput" placeholder="Enter Faculty Name (e.g., John)">
        <button onclick="searchFaculty()">Search</button>
    </div>

    <div id="profile" class="profile-card">
        <img id="f-photo" class="profile-pic" src="" alt="Faculty Photo">
        <h3 id="f-name"></h3>
        <div class="details">
            <p><strong>Email:</strong> <span id="f-email"></span></p>
            <p><strong>Highest Qualification:</strong> <span id="f-qual"></span></p>
            <p><strong>Subjects (Current Sem):</strong> <span id="f-subj"></span></p>

        function searchFaculty() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let card = document.getElementById('profile');
            let errorMsg = document.getElementById('error-msg');
            // Find faculty by matching substring
            let faculty = facultyDB.find(f => f.name.toLowerCase().includes(input));

            if (faculty && input.trim() !== "") {
                document.getElementById('f-name').innerText = faculty.name;
                document.getElementById('f-photo').src = faculty.photo;
                document.getElementById('f-email').innerText = faculty.email;
                document.getElementById('f-qual').innerText = faculty.qualification;
                document.getElementById('f-subj').innerText = faculty.subjects;
                document.getElementById('f-research').innerText = faculty.research;  
                card.style.display = "block";
                errorMsg.innerText = "";
            } else {
                card.style.display = "none";
                errorMsg.innerText = "Faculty not found. Please try another name.";
            }
        }
